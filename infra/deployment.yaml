apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-demo
  template:
    metadata:
      labels:
        app: otel-demo
    spec:
      containers:
      - name: otel-demo
        image: otel-demo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HW_ACCESS_KEY
          value: "your_access_key"
        - name: HW_SECRET_KEY
          value: "your_secret_key"
        - name: HW_REGION
          value: "cn-north-4"
        - name: SERVICE_NAME
          value: "otel-huawei-demo"
        - name: LOG_GROUP
          value: "/otel/demo"
        - name: METRICS_NAMESPACE
          value: "otel-huawei-demo"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: otel-demo
